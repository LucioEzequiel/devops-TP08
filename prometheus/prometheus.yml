# ============================================
# prometheus.yml - Configuracion de scrape
# TP08 - Plan DevOps
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devops-portfolio'
    environment: 'local'

rule_files:
  - "alerts.yml"

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: flask-app
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'notes-backend'

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: 'devops-tp08'
        action: keep
